## IDF Component Manager Manifest File
dependencies:
  # The IoT SDK itself. override_path uses the local component during development
  # (this repo); when the example is instantiated from the registry, the override
  # is ignored and the published version is fetched instead.
  videosdk/iot-sdk:
    version: "*"
    override_path: "../../../"
  idf:
    version: ">=5.4.0"
  mdns: "*"
  # Wi-Fi/network helper (example_connect). Bundled with ESP-IDF, resolved from
  # $IDF_PATH -- not a registry component.
  protocol_examples_common:
    path: ${IDF_PATH}/examples/common_components/protocol_examples_common
