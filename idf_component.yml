version: "0.4.0"
description: "IoTSdk is a lightweight ESP-IDF component that enables ESP32-based IoT devices to participate in real-time rooms through the VideoSDK platform. It provides seamless integration for joining rooms and publishing/subscribing to audio and video."
url: "https://github.com/videosdk-live/IoTSdk"
repository: "https://github.com/videosdk-live/IoTSdk.git"
issues: "https://github.com/videosdk-live/IoTSdk/issues"
documentation: "https://docs.videosdk.live/iot/guide/video-and-audio-calling-api-sdk/concept-and-architecture"
license: "MIT"
tags:
  - iot
  - audio
  - webrtc
  - videosdk
  - rtc
targets:
  - esp32s3
dependencies:
  idf: ">=5.4.2,<=5.4.4"
  mdns: "*"
  espressif/esp_audio_codec: "~2.3.0"
  espressif/esp_codec_dev: "~1.3.4"
  espressif/esp_audio_effects: "~1.1.0"
  espressif/esp_video_codec: "~0.5.2"
  espressif/esp_jpeg: "^1.3.1"
  espressif/esp_new_jpeg: "*"
  espressif/esp32-camera: "^2.0.15"
  espressif/esp_websocket_client: "^1.2.0"
  sepfy/srtp: "^2.3.0"
  sepfy/usrsctp: "^0.9.5"

files:
  exclude:
    - "**/build/**"
    - "**/managed_components/**"
    - "**/sdkconfig"
    - "**/sdkconfig.old"
    - "**/dependencies.lock"
    - "**/.DS_Store"
    - "**/.gitignore"
